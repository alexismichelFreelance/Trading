# Per-sleeve promotion evidence (see PROMOTION_GATE.md).
#
# G2/G3/G4 cannot be derived from the paper record -- they are facts about how a
# sleeve was BUILT. They are declared here and checked for presence and internal
# consistency by tools/promotion_check.py. An undeclared sleeve FAILS; silence is
# not a pass. Lying here is possible, which is why each entry names the tool and
# data range that produced it, so a claim can be re-run.
#
# tier: current size tier (t0 paper / t1 / t2 / t3) -- see the size ladder.

sleeves:
  sweepfade:
    tier: t0
    # G2 -- was anything tuned, and on what?
    calibration:
      tool: tools/sweep_backtest.py
      window: "ESM5 2025-05-05..2025-05-30"
      params_chosen: [min_span_ticks, hold_s]
    # G3 -- independent replication
    out_of_sample:
      window: "ESH5 2025-02-18..2025-03-19"
      same_sign: true
      median_ratio: 1.0        # ESM5 +0.50pt vs ESH5 +0.50pt at span>=6/15s
    # G4 -- what execution was assumed
    costs:
      entry: cross
      exit: cross              # pessimistic: both sides aggressive
      needs_passive_fills: false
    control_twin: sweepfollow
    notes: >
      Evaluation window OVERLAPS the calibration window (both ESM5 May), so G2
      FAILS as recorded. The forward paper record is what will supply a clean
      evaluation window; replay cannot.

  sweepfade_deep:
    tier: t0
    calibration:
      tool: tools/sweep_backtest.py
      window: "ESM5 2025-05-05..2025-05-30"
      params_chosen: [min_span_ticks, hold_s]
    out_of_sample:
      window: "ESH5 2025-02-18..2025-03-19"
      same_sign: true
      median_ratio: 1.0        # +0.75pt on both contracts at span>=8/15s
    costs:
      entry: cross
      exit: cross
      needs_passive_fills: false
    control_twin: sweepfollow
    notes: Same G2 overlap caveat as sweepfade.

  pivot:
    tier: t0
    calibration:
      tool: tools/pivot_bias_calib.py
      window: "ES live capture 2026-06-16..2026-07-24"
      params_chosen: [ER_MIN_NORM]
    out_of_sample: null        # none yet -- G3 FAILS
    costs:
      entry: cross
      exit: cross
      needs_passive_fills: false
    control_twin: null
    notes: >
      ER_MIN_NORM was chosen on the SAME capture used to score it, so every
      replay number for this sleeve is in-sample by construction. Needs a clean
      forward window before any of it counts.

  flow:
    tier: t0
    calibration:
      tool: tools/flow_calib.py
      window: "ES live capture 2026-06-16..2026-07-24"
      params_chosen: [FLOW_K]
    out_of_sample: null
    costs:
      entry: cross
      exit: cross
      needs_passive_fills: false
    control_twin: flow_fixed
    notes: >
      In-sample like pivot. Separately, tools/flow_stability.py showed the
      netted per-second adelta this sleeve consumes points at the COMPLETED
      move, and tools/sweep_replication.py showed that netting destroys the
      sweep structure that does carry information. Not a promotion candidate.

  ibs:
    tier: t0
    # G2 -- the 0.20/0.80 thresholds are the PUBLISHED spec ("IBS effect"
    # literature, UBS desk-note lineage) and were not fitted here. But the
    # sleeve was SELECTED from 6 screened candidates in
    # strategy_lab/QUIET_CLASSICS_SCREEN.md, and selection is fitting, so the
    # screen window is declared as calibration. Bonferroni x6 noted there;
    # t=5.0 on 486 trades survives it. Re-derived independently 2026-08-01 by
    # strategy_lab/ibs_verify.py (original screen script was not kept).
    calibration:
      tool: strategy_lab/ibs_verify.py
      window: "SPX daily 2010-01-01..2025-06-30 (460 trades)"
      params_chosen: []        # thresholds inherited, not scanned
    # G3 -- the year since the screen was written, never seen when it was.
    # Same sign and strongly positive, but 2.7x the calibration median: the
    # window is only 26 trades and fell in a high-volatility regime that
    # favours daily mean reversion (2025 alone: +881pt). Declared as measured;
    # this FAILS the +/-50% band and should, until the magnitudes match.
    out_of_sample:
      window: "SPX daily 2025-07-01..2026-07-31 (26 trades)"
      same_sign: true
      median_ratio: 2.69       # OOS +28.11pt vs calibration +10.43pt median
    # G4 -- MOC execution on both legs, so both sides cross. Verified net of
    # 0.517pt round-turn (es_costs aggressive preset).
    costs:
      entry: cross
      exit: cross
      needs_passive_fills: false
    control_twin: null         # ibs_gex is a SIZE variant, not a control
    notes: >
      Validated on SPX index daily bars, not ES. Points translate ~1:1 but the
      forward paper record is the only ES evidence and is 2 sessions long.
      Binding constraint is G7 (40 sessions). NO STOP by design -- the classic
      spec; stops break daily mean reversion. Tail is real: worst trade -321pt
      (-$16,050/contract), max equity drawdown -386pt, one losing year in 16
      (2018, -364pt). Sizing is the entire risk control.
