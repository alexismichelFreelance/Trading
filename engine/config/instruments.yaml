# Per-instrument contract specs. Root symbols; contract months (ESM5/ESH5)
# resolve to their root via engine.core.config.root_symbol().
# Unknown keys land in InstrumentSpec.extra (options-ready escape hatch).
instruments:
  ES:
    point_usd: 50.0
    tick: 0.25
    asset_class: future
    hmm_path: config/hmm_es_1h.json
    round_step: 50.0
    replay:
      sec_tables:
        ESM5: claude_sec_feat
        ESH5: claude_sec_feat_esh5
      bars_table: claude_bars_1m
    gex:
      underlying: SPX
      basis: 42.0            # ES over SPX at 16:00 ET 2026-07-20 (Sep contract;
                             # was 52 on Jun) — re-measure over the week
  NQ:
    point_usd: 20.0
    tick: 0.25
    asset_class: future
    yahoo: NQ=F              # daily bars for the 1d zone view
    gex:
      underlying: NDX
      basis: 181.0           # NQ over NDX at 16:00 ET 2026-07-20 (first sample;
                             # re-measure over the week, same as ES)
  GC:
    point_usd: 100.0
    tick: 0.10
    asset_class: future
