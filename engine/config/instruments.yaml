instruments:
  ES:
    point_usd: 50.0
    tick: 0.25
    asset_class: future
    hmm_path: config/hmm_es_1h.json
    round_step: 50.0
    replay:
      sec_tables:
        ESM5: claude_sec_feat
        ESH5: claude_sec_feat_esh5
      bars_table: claude_bars_1m
    trend_join:
      conf_pts: 27.0
      stop_pts: 6.0
    gex:
      underlying: SPX
      basis: 42.0
  NQ:
    trend_join:
      conf_pts: 186.0
      stop_pts: 53.0
    point_usd: 20.0
    tick: 0.25
    asset_class: future
    yahoo: NQ=F
    replay:
      sec_tables:
        NQ: claude_sec_live
      bars_table: claude_bars_live
    gex:
      underlying: NDX
      basis: 181.0
  GC:
    point_usd: 100.0
    tick: 0.10
    asset_class: future
    # Yahoo continuous for the 1d zone seed + D/W/M pivot grid. Without it
    # daily_bars_for() returns [] and the daily detectors start cold.
    yahoo: GC=F
    # Gold's psychological round-number grid is $50, not ES's 50 POINTS
    # (GC trades near $4,000, so 50 is ~1.2% and still meaningful).
    round_step: 50.0