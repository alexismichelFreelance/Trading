# Per-instrument contract specs. Root symbols; contract months (ESM5/ESH5)
# resolve to their root via engine.core.config.root_symbol().
# Unknown keys land in InstrumentSpec.extra (options-ready escape hatch).
instruments:
  ES:
    point_usd: 50.0
    tick: 0.25
    asset_class: future
    hmm_path: config/hmm_es_1h.json
    round_step: 50.0
    replay:
      sec_tables:
        ESM5: claude_sec_feat
        ESH5: claude_sec_feat_esh5
      bars_table: claude_bars_1m
    # TrendJoin sizing. Measured, not chosen: strategy_lab/move_catalog_any.py
    # shows big legs still qualify ~100% at a confirmation of 40% of the session
    # range while small ones collapse to 22-30%, on ES 2025, ES 2026 AND NQ 2026
    # alike. It has to be a CONSTANT per instrument, not adaptive: nothing
    # predicts today's range any more (prev-day R2 0.53 in 2025 -> 0.03 in 2026),
    # and a noisy threshold is worse than a fixed one. Set at 40% of this
    # instrument's own median RTH range; stop at its measured median MAE.
    trend_join:
      conf_pts: 27.0        # 0.40 x 68pt median RTH range
      stop_pts: 6.0         # median MAE after confirmation
    gex:
      underlying: SPX
      basis: 42.0            # FALLBACK ONLY. The live basis is MEASURED each
                             # session (engine/features/gamma_basis.py) from the
                             # stored index close and our own futures close. It
                             # DECAYS toward expiry -- 47.6 -> 22.5 over 13
                             # sessions -- so this constant was 21.7 points out
                             # by 2026-08-15. "was 52 on Jun" was recording the
                             # roll without naming it. Used only when there is
                             # nothing to measure, and logged when it is.
  NQ:
    trend_join:
      conf_pts: 186.0       # 0.40 x 465pt median RTH range
      stop_pts: 53.0        # median MAE after confirmation
    point_usd: 20.0
    tick: 0.25
    asset_class: future
    yahoo: NQ=F              # daily bars for the 1d zone view
    gex:
      underlying: NDX
      basis: 181.0           # FALLBACK ONLY -- see the ES note. Measured, NQ
                             # ran 225.1 -> 99.5 over the same 13 sessions, so
                             # this was 81.5 points out by 2026-08-15 and every
                             # NDX wall was drawn that far above where it sits.
  GC:
    point_usd: 100.0
    tick: 0.10
    asset_class: future
