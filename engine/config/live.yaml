# Per-instrument LIVE lane config, consumed by tools/run_live.py --instruments.
# Each lane needs its own EngineRelay (strategy on that instrument's minimized
# chart, with matching MarketPort/BrokerPort properties) and its own
# EngineOverlay indicator (DrawPort) on the chart you watch.
#
#   .venv/Scripts/python.exe tools/run_live.py --instruments ES        # same as default
#   .venv/Scripts/python.exe tools/run_live.py --instruments ES,NQ    # two lanes
#
# paper: roster that always paper-trades ('all' or comma list of labels)
# live:  subset that ALSO routes to the NT8 broker ('' = pure paper)
instruments:
  ES:
    market_port: 36001
    broker_port: 36002
    draw_port: 36004
    # CUT 2026-08-25, on agreement between the full replay, the replay
    # restricted to sessions the live record also covers, and the live record
    # itself -- the only sleeves condemned by every slice of the data:
    #   flow      replay -2,725 (23 sessions) / matched replay -875 / live
    #             -5,650 over 17 sessions
    #   ignition  replay -1,012 (18 sessions) / matched -750 / live -900 over 15
    # Both are BASE variants whose exit-improved twins win under both methods
    # (flow_lg, flow_gex, ignition_fixed, ignition_lg), so the family stays and
    # only the broken exit goes.
    # NOT cut, though they also showed losses: trendjoin_narrow and opendrive
    # flip sign with the session set (ES trendjoin_narrow -6,738 on 13 matched
    # sessions, +8,325 on 29), which is a statement about the sample, not the
    # sleeve.
    # onfade ADDED 2026-09-05 and picked up automatically by 'all'. Fades the
    # 18:00->09:30 overnight move at the open, target 75% of that move, stop
    # 0.75x the overnight range. The only sleeve here whose config was chosen on
    # a train half and scored ONCE: 1,145 ES sessions replayed through the real
    # engine give $164/trade, t=5.50, 75% wins, maxDD -10,878 (test half $178,
    # t=3.42). It fires once per session, every session. ES ONLY -- NQ is
    # untested and the last overnight-signal sleeve (failed-break fade) worked
    # on ES and died on NQ, so it does not go in the NQ roster on faith.
    # ROUTED LIVE 2026-09-06 (demo account). The 40-forward-paper-session gate
    # (G7) is SUSPENDED by explicit decision, and the reason is sound: the paper
    # record has never survived 40 sessions without a critical bug being found in
    # the engine underneath it -- fill pricing, ingest, accounting, the roster
    # itself -- so the clock has never actually started. Waiting for 40 clean
    # sessions of a record that keeps being invalidated is not caution, it is a
    # loop. Every other gate still applies, and the risk supervisor is on with
    # its production limits (10/sleeve, 15 gross, halt at -$5,000, entry lockout
    # 15:45 ET, flatten 15:58 ET).
    #   zones      5/5 computable gates, 83% sign, mean $762   (n=6, risk-sized)
    #   zones_15m  4/5, mean $1,390, median $768, total +$13,901 (n=10)
    #   zones_gap  3/5 but the largest total on both lanes, +$23,087 (n=30)
    #   pivot      5/5, 70% sign, mean $560, median $841       (n=10)
    #   onfade     see below
    # The zones family is the ONLY thing in the book that replicates across
    # instruments: same sign and similar magnitude on ES and NQ, which is what
    # G3 asks for. Its samples are small BECAUSE these sleeves fire rarely.
    paper: "all"
    live: "zones,zones_15m,zones_gap,pivot,onfade"
    # onfade goes live on the strength of its OWN replay -- 1,145 ES sessions,
    # $164/trade, t=5.50, 75% wins -- and not on the 38-session window above,
    # where it made -$14/trade. Both numbers are real and they do not conflict:
    # 38 sessions inside a 1,145-session sample, well within a drawdown the
    # backtest already measured at -$10,878. Stated here because the short
    # window is the one that will be visible day to day.
  NQ:
    market_port: 36011
    broker_port: 36012
    draw_port: 36014
    # RAW DEPTH CAPTURE OFF 2026-09-02. NQ was writing 11.5M of the 15.5M daily
    # rows into claude_depth_live (ES 3.9M); the table stood at 272M rows over 27
    # days and had QuestDB pinned. On 2026-09-01 it stopped committing entirely
    # and the last ~90 minutes of RTH were lost on EVERY table while the engine
    # ran on believing itself healthy.
    #
    # Nothing consumes this table. The live sleeves (flow, ignition, open_drive)
    # read per-second BookFlow, which is built inside the feed from the same DOM
    # stream and is UNAFFECTED by this switch -- NinjaTraderFeed calls
    # agg.accumulate(ev) unconditionally and only the raw DepthUpdate is gated.
    # claude_sec_live still carries NQ book add/cancel.
    #
    # The research record on raw depth is three nulls and one effect the exact
    # size of the spread ($7.30/contract against $16 round turn) -- see the
    # intraday-cost-floor and orderflow-postshock notes. ES stays on because the
    # one open question (order flow in the post-shock window) is an ES question
    # and needs ~100 sessions; it had 18.
    #
    # NQ TICKS are still captured: claude_ticks_live is small and useful.
    capture_depth: false
    # Everything whose levels/stops derive from NQ's OWN price action, so it
    # ports without retuning. EXCLUDED on purpose:
    #   ignition / ignition_fixed / ignition_gex -- would silently borrow ES's
    #     fitted HMM (NQ has no hmm_path), and carry hard ES-point thresholds
    #     (chop_stop 4.0, trend_cap 12.0, trail 6/10, pivot_min_dist 2.0) that
    #     are meaningless where a session ranges ~400pt instead of ~65pt.
    #   flow_fixed -- absolute adelta threshold (th=200) is ES-scaled; the
    #     adaptive `flow` variant is a z-score, so it ports fine.
    # Re-add ignition once an NQ HMM is fitted and its points are re-scaled.
    # Also NO *_gex variants here: _gamma_or_none() returns None for anything
    # but ES (SPX dealer gamma is not an NDX signal), so on NQ every *_gex
    # sleeve is a byte-identical DUPLICATE of its raw twin -- confirmed by
    # tools/sleeve_audit.py, where all 6 pairs matched exactly. Duplicates burn
    # compute and, worse, look like independent agreement in a twin comparison.
    # Re-add them only once an NDX-based GammaRegime exists.
    # TRENDJOIN_GEX ADDED 2026-09-09: NDX GammaRegime now exists via
    # claude_gex_levels (CBOE true-OI, ≤7 DTE). Validation on 2026-08-22->09-01
    # (10 sessions): raw -367.9 pts (93 trades) -> gated +48.1 pts (23 trades),
    # delta +416 pts. The gate eliminates all long-gamma chop entries.
    # trendjoin ADDED 2026-08-16. It is the best sleeve on NQ by a wide margin
    # and had never been deployed there, while instruments.yaml has carried
    # NQ-calibrated parameters for it all along (conf_pts 186, stop_pts 53,
    # sized off NQ's own ~465pt median range rather than copied from ES).
    # Replay, 23 recorded NQ sessions:
    #     trendjoin_narrow  +36,925  1,605/day  70% of days positive
    #     opendrive_2p24    +20,430    888/day  91%
    #     zones_gap         +15,215  2,174/day  57%  (7 days only)
    # Normalised for size it captures ~17% of NQ's daily range against ~9.5% on
    # ES, so it is genuinely better here and not merely bigger.
    #
    # `narrow` (half the confirmation distance) is the variant with the most
    # activity -- 23 of 23 sessions against 19 for the others -- and is chosen
    # for that, not for topping this window: trendjoin_2p32 scored higher
    # (+42,635) and picking it would be selecting on the outcome of the only
    # sample we have. Both run in paper; the deployed choice can move once a
    # paired difference over more sessions says something.
    # opendrive_vac is the break-quality TWIN of opendrive: identical entry and
    # exit, refusing only the breaks whose move happened on opposing delta (see
    # engine/features/break_quality.py). It belongs here more than on ES --
    # NQ:opendrive is where the losses are (2026-08-19 -$2,190, 2026-08-21
    # -$4,465, the latter 94% of that day's loss), and until now the gated twin
    # ran only on the ES lane, where there was nothing much to refuse.
    # It fails OPEN for its first 5 sessions while the threshold warms, so
    # expect it to trade identically to opendrive at first -- that is the
    # design, not a fault.
    # opendrive CUT 2026-08-25. The clearest loser in the book: negative in the
    # full replay (-12,265 over 24 sessions, median -375, still negative
    # excluding its worst day), in the replay restricted to live-covered
    # sessions (-20,095) and in the live record itself (-17,595) -- three
    # measurements, similar magnitudes. NQ-specific: opendrive_2p24 (+6,535) and
    # opendrive_vac (+8,205) take the SAME entries and win, so the entry is fine
    # and the base exit is not.
    # COST OF THIS CUT, stated because it is real: opendrive_vac was the paired
    # TWIN of opendrive and existed to isolate the break-quality gate. Removing
    # the control ends that comparison, and opendrive_vac had only ~10 mature
    # sessions (it fails open for its first 5 while its threshold warms). Its
    # forward record now has nothing to be compared against.
    # ROUTED LIVE 2026-09-06 (demo account), same suspension of G7 as ES.
    #   zones          5/5 computable gates, 100% sign, mean $1,739  (n=4)
    #   zones_15m      5/5, 100% sign, mean $1,440, median $1,550    (n=6)
    #   zones_gap      4/5, mean $1,738, total +$24,331              (n=14)
    #   opendrive_2p24 4/5, 85% sign on 94% of sessions, mean $113   (n=33)
    # opendrive_2p24 is the ONE survivor of the opendrive family: the base sleeve
    # is -$490/session here and its `_vac` twin fails G9 against it, but the
    # 24-point-armed two-phase exit takes the same entries and posts 85% sign
    # consistency. The entry was never the problem; the base exit was.
    # NOT live on NQ: pivot (27% sign, negative median here -- it is ES-only) and
    # onfade (measured and FAILS on NQ: $94/trade at t=0.43 over 194 sessions,
    # against ES $207 at t=3.09 on the same window).
    # dipbuy dropped: it is not in ALL_LABELS and produced no fills in the replay.
    paper: "zones,zones_15m,zones_gap,pivot,opendrive_2p24,trendjoin,trendjoin_gex,trendjoin_narrow,trendjoin_pb8,trendjoin_scale100,ibs,rsi2,dip3"
    live: "zones,zones_15m,zones_gap,opendrive_2p24,trendjoin_gex"
