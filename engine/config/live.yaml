# Per-instrument LIVE lane config, consumed by tools/run_live.py --instruments.
# Each lane needs its own EngineRelay (strategy on that instrument's minimized
# chart, with matching MarketPort/BrokerPort properties) and its own
# EngineOverlay indicator (DrawPort) on the chart you watch.
#
#   .venv/Scripts/python.exe tools/run_live.py --instruments ES        # same as default
#   .venv/Scripts/python.exe tools/run_live.py --instruments ES,NQ    # two lanes
#
# paper: roster that always paper-trades ('all' or comma list of labels)
# live:  subset that ALSO routes to the NT8 broker ('' = pure paper)
instruments:
  ES:
    market_port: 36001
    broker_port: 36002
    draw_port: 36004
    # CUT 2026-08-25, on agreement between the full replay, the replay
    # restricted to sessions the live record also covers, and the live record
    # itself -- the only sleeves condemned by every slice of the data:
    #   flow      replay -2,725 (23 sessions) / matched replay -875 / live
    #             -5,650 over 17 sessions
    #   ignition  replay -1,012 (18 sessions) / matched -750 / live -900 over 15
    # Both are BASE variants whose exit-improved twins win under both methods
    # (flow_lg, flow_gex, ignition_fixed, ignition_lg), so the family stays and
    # only the broken exit goes.
    # NOT cut, though they also showed losses: trendjoin_narrow and opendrive
    # flip sign with the session set (ES trendjoin_narrow -6,738 on 13 matched
    # sessions, +8,325 on 29), which is a statement about the sample, not the
    # sleeve.
    paper: "all,-flow,-ignition"
    live: ""
  NQ:
    market_port: 36011
    broker_port: 36012
    draw_port: 36014
    # Everything whose levels/stops derive from NQ's OWN price action, so it
    # ports without retuning. EXCLUDED on purpose:
    #   ignition / ignition_fixed / ignition_gex -- would silently borrow ES's
    #     fitted HMM (NQ has no hmm_path), and carry hard ES-point thresholds
    #     (chop_stop 4.0, trend_cap 12.0, trail 6/10, pivot_min_dist 2.0) that
    #     are meaningless where a session ranges ~400pt instead of ~65pt.
    #   flow_fixed -- absolute adelta threshold (th=200) is ES-scaled; the
    #     adaptive `flow` variant is a z-score, so it ports fine.
    # Re-add ignition once an NQ HMM is fitted and its points are re-scaled.
    # Also NO *_gex variants here: _gamma_or_none() returns None for anything
    # but ES (SPX dealer gamma is not an NDX signal), so on NQ every *_gex
    # sleeve is a byte-identical DUPLICATE of its raw twin -- confirmed by
    # tools/sleeve_audit.py, where all 6 pairs matched exactly. Duplicates burn
    # compute and, worse, look like independent agreement in a twin comparison.
    # Re-add them only once an NDX-based GammaRegime exists.
    # trendjoin ADDED 2026-08-16. It is the best sleeve on NQ by a wide margin
    # and had never been deployed there, while instruments.yaml has carried
    # NQ-calibrated parameters for it all along (conf_pts 186, stop_pts 53,
    # sized off NQ's own ~465pt median range rather than copied from ES).
    # Replay, 23 recorded NQ sessions:
    #     trendjoin_narrow  +36,925  1,605/day  70% of days positive
    #     opendrive_2p24    +20,430    888/day  91%
    #     zones_gap         +15,215  2,174/day  57%  (7 days only)
    # Normalised for size it captures ~17% of NQ's daily range against ~9.5% on
    # ES, so it is genuinely better here and not merely bigger.
    #
    # `narrow` (half the confirmation distance) is the variant with the most
    # activity -- 23 of 23 sessions against 19 for the others -- and is chosen
    # for that, not for topping this window: trendjoin_2p32 scored higher
    # (+42,635) and picking it would be selecting on the outcome of the only
    # sample we have. Both run in paper; the deployed choice can move once a
    # paired difference over more sessions says something.
    # opendrive_vac is the break-quality TWIN of opendrive: identical entry and
    # exit, refusing only the breaks whose move happened on opposing delta (see
    # engine/features/break_quality.py). It belongs here more than on ES --
    # NQ:opendrive is where the losses are (2026-08-19 -$2,190, 2026-08-21
    # -$4,465, the latter 94% of that day's loss), and until now the gated twin
    # ran only on the ES lane, where there was nothing much to refuse.
    # It fails OPEN for its first 5 sessions while the threshold warms, so
    # expect it to trade identically to opendrive at first -- that is the
    # design, not a fault.
    # opendrive CUT 2026-08-25. The clearest loser in the book: negative in the
    # full replay (-12,265 over 24 sessions, median -375, still negative
    # excluding its worst day), in the replay restricted to live-covered
    # sessions (-20,095) and in the live record itself (-17,595) -- three
    # measurements, similar magnitudes. NQ-specific: opendrive_2p24 (+6,535) and
    # opendrive_vac (+8,205) take the SAME entries and win, so the entry is fine
    # and the base exit is not.
    # COST OF THIS CUT, stated because it is real: opendrive_vac was the paired
    # TWIN of opendrive and existed to isolate the break-quality gate. Removing
    # the control ends that comparison, and opendrive_vac had only ~10 mature
    # sessions (it fails open for its first 5 while its threshold warms). Its
    # forward record now has nothing to be compared against.
    paper: "zones,zones_gap,dipbuy,ibs,pivot,opendrive_vac,flow,vwapbreak,onbreak,trendjoin,trendjoin_narrow"
    live: ""
