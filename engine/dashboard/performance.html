<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>es-engine performance</title>
<link rel="stylesheet" href="/style.css">
<style>
  .perfContainer { padding: 14px; }
  .perfControls { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .perfControls label { color: var(--muted); font-size: 12px; }
  .perfControls select, .perfControls input { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font-size: 12px; }
  .perfControls button { background: var(--panel2); color: var(--accent); border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 12px; }
  .perfControls button:hover { border-color: var(--accent); }
  .metricsGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .metricCard { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .metricCard h4 { margin: 0 0 6px; font-size: 12px; color: var(--accent); }
  .metricRow { display: flex; justify-content: space-between; font-size: 11.5px; padding: 2px 0; }
  .metricRow .lbl { color: var(--muted); }
  .metricRow .val { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
  .metricRow .val.pos { color: var(--green); }
  .metricRow .val.neg { color: var(--red); }
  .chartBox { height: 300px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; }
  .tradeTable { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .tradeTable th { text-align: left; color: var(--muted); padding: 4px 8px; border-bottom: 1px solid var(--border); font-weight: 600; }
  .tradeTable td { padding: 3px 8px; border-bottom: 1px solid var(--panel2); color: var(--text); font-variant-numeric: tabular-nums; }
  .tradeTable tr:hover { background: var(--panel2); }
  .tradeTable .pos { color: var(--green); }
  .tradeTable .neg { color: var(--red); }
  .section { margin-bottom: 20px; }
  .section h3 { font-size: 13px; color: var(--text); margin: 0 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .backLink { color: var(--accent); text-decoration: none; font-size: 12px; }
  .backLink:hover { text-decoration: underline; }
  .loading { color: var(--muted); font-size: 12px; padding: 20px; text-align: center; }
</style>
</head>
<body>
<header id="topbar">
  <div class="brand">
    <span class="dot"></span>
    <strong>es-engine</strong>
    <span class="sub">performance</span>
  </div>
  <div class="controls">
    <a href="/" class="backLink">&larr; back to chart</a>
  </div>
  <div id="status" class="status">loading.</div>
</header>
<main class="perfContainer">
  <div class="perfControls">
    <label>symbol <select id="symSel"></select></label>
    <label>from <input type="date" id="fromDate"></label>
    <label>to <input type="date" id="toDate"></label>
    <button id="loadBtn">load</button>
  </div>
  <div id="loading" class="loading">Loading performance data...</div>
  <div id="content" style="display:none;">
    <div class="section">
      <h3>equity curve (aggregate)</h3>
      <div id="aggChart" class="chartBox"></div>
    </div>
    <div class="section">
      <h3>aggregate metrics</h3>
      <div id="aggMetrics" class="metricsGrid"></div>
    </div>
    <div class="section">
      <h3>per-strategy metrics</h3>
      <div id="stratMetrics" class="metricsGrid"></div>
    </div>
    <div class="section">
      <h3>trade log (last 50 per strategy)</h3>
      <div style="max-height:400px;overflow-y:auto;">
        <table class="tradeTable">
          <thead><tr><th>strategy</th><th>side</th><th>entry ts</th><th>exit ts</th><th>entry</th><th>exit</th><th>qty</th><th>pnl</th><th>tag</th></tr></thead>
          <tbody id="tradeBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>
<script src="/vendor/lightweight-charts.standalone.production.js"></script>
<script src="/performance.js?v=1"></script>
</body>
</html>
