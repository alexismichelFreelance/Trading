<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>es-engine dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header id="topbar">
  <div class="brand">
    <span class="dot"></span>
    <strong>es-engine</strong>
    <span class="sub">inspect-first dashboard</span>
  </div>
  <div class="controls">
    <label>symbol <select id="laneSel"></select></label>
    <label>timeframe <select id="tfSel"></select></label>
    <button id="popBtn" class="cta" title="open this window's chart in its own tab">⤢ pop-out</button>
    <button id="plusBtn" title="add another chart window (+ tab)">+ add chart</button>
    <button id="gridBtn" title="toggle 2-up grid">▦ grid</button>
    <button id="stratBtn" title="toggle strategy list">⚙ strategies</button>
    <button id="gammaBtn" title="dealer-gamma map">γ gamma</button>
  </div>
  <div id="status" class="status">connecting…</div>
  <span id="errorBadge" class="badge hidden">0</span>
  <button id="latestBtn" title="jump to latest candle and re-enable auto-scroll">latest</button>
  <button id="indBtn" title="toggle indicator list">indicators</button>
</header>

<main id="grid"></main>

<section id="logDrawer" class="drawer hidden">
  <header class="drawerHead">engine log <span class="hint">last 300</span></header>
  <div id="log"></div>
</section>

<section id="stratDrawer" class="drawer hidden">
  <header class="drawerHead">strategies <span class="hint">show / hide overlays</span></header>
  <div id="roster"></div>
</section>
<section id="gammaDrawer" class="drawer hidden">
  <header class="drawerHead">dealer gamma <span class="hint">multi-wall map from engine</span></header>
  <div id="gammaBody"></div>
</section>
<section id="indDrawer" class="drawer hidden">
  <header class="drawerHead">indicators <span class="hint">show / hide</span></header>
  <div id="indicators"></div>
</section>

<div id="overlay" class="hidden"></div>

<script src="/vendor/lightweight-charts.standalone.production.js"></script>
<script src="/app.js?v=65"></script>

</body>
</html>
